# Настройки pnpm. С 12-й версии они живут здесь, а не в package.json.
#
# Пакеты, которым разрешено выполнять скрипты установки. Разрешение
# точечное и осознанное: по умолчанию pnpm постустановочные скрипты не
# запускает, и это правильно — чужой код не должен выполняться у нас
# молча. Этим трём он нужен по делу:
#
#   esbuild         — скачивает бинарник под платформу, без него не
#                     работает Vitest;
#   prisma,
#   @prisma/engines — скачивают движок запросов, без него не работает
#                     ни генерация клиента, ни миграции.
#
# Новый пакет сюда добавляется только после того, как понятно, зачем
# ему скрипт установки.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
